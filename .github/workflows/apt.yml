name: APT and Void repositories

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release to distribute
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends apt-utils gnupg
      - name: Download and verify released packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern '*-unknown-linux-musl.tar.gz' \
            --pattern SHA256SUMS --dir target/apt-input
          cd target/apt-input
          awk '$2 ~ /\.deb$/ { print }' SHA256SUMS | sha256sum -c -
      - name: Sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          GNUPGHOME: ${{ runner.temp }}/grava-gnupg
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" && test -n "$APT_GPG_FINGERPRINT"
          mkdir -m 0700 -p "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          packaging/apt/build-repository.sh target/apt-input target/pages/apt "$APT_GPG_FINGERPRINT"
          touch target/pages/.nojekyll
      - name: Prepare Void repository tools
        run: |
          docker run --detach --name grava-void \
            ghcr.io/void-linux/void-glibc-full@sha256:0d8ab93458484cc3fa1e52d2efd4062c3dcca486c09c57068e99bc4b77e59ea0 \
            sleep infinity
          docker exec grava-void sh -c 'xbps-install -Syu xbps && xbps-install -y bash binutils openssl'
          docker cp packaging/void grava-void:/build-scripts
          docker cp target/apt-input grava-void:/release
      - name: Sign the Void repository
        env:
          VOID_RSA_PRIVATE_KEY: ${{ secrets.VOID_RSA_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$VOID_RSA_PRIVATE_KEY"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"; docker exec grava-void rm -f /signing-key.pem || true' EXIT
          (umask 077; printf '%s' "$VOID_RSA_PRIVATE_KEY" > "$keydir/private.pem")
          docker cp "$keydir/private.pem" grava-void:/signing-key.pem
          docker exec grava-void /build-scripts/build-repository.sh \
            /release "${RELEASE_TAG#v}" /repository /signing-key.pem
          docker cp grava-void:/repository target/pages/void
          cmp packaging/void/grava-repository-key.pem target/pages/void/grava-repository-key.pem
      - name: Remove the Void tools container
        if: always()
        run: docker rm --force grava-void || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
