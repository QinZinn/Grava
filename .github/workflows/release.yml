name: Release

# Pushing a tag such as v0.1.0 builds fully static musl binaries with the
# default features and publishes them. Run it by hand to test the build: the
# archives are then kept as workflow artifacts and nothing is released.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The default features are pure Rust, so the musl target's own C library
      # is all that is linked; musl-tools only supplies the `musl-gcc` driver.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check that the binary is static and runs
        run: |
          binary=target/${{ matrix.target }}/release/grava
          file "$binary" | tee /dev/stderr | grep -E 'statically linked|static-pie linked'
          "$binary" --version
          "$binary" --headless -i demo --frames 60 --size 60x30 --seed 1 --no-color | head -n 3
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          name="grava-${version}-${{ matrix.target }}"
          binary=target/${{ matrix.target }}/release/grava
          mkdir -p "dist/$name"
          cp "$binary" LICENSE README.md "dist/$name/"
          cp assets/config.toml "dist/$name/config.toml"
          "$binary" --man > "dist/$name/grava.1"
          mkdir "dist/$name/completions"
          for shell in bash zsh fish; do
            "$binary" --completions "$shell" > "dist/$name/completions/grava.$shell"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: grava-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect the checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm ./*.sha256
          ls -l
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "grava ${GITHUB_REF_NAME#v}" \
            --generate-notes
