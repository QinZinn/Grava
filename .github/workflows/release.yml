name: Release

# Pushing a tag builds static musl archives, RPMs and DEBs with default features.
# A manual run keeps artifacts for testing without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rust-docs
      # The default features are pure Rust, so the musl target's own C library
      # is all that is linked; musl-tools only supplies the `musl-gcc` driver.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools rpm binutils python3
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match Cargo.toml"
          PY
      - name: Build and package
        run: packaging/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: grava-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect the checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm ./*.sha256
          ls -l
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "grava ${GITHUB_REF_NAME#v}" \
            --generate-notes
