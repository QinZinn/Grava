name: Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --platform=${{ matrix.arch }}
      - name: Check the installed snap without audio capture
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap run grava --version
          snap run grava --headless -i demo --frames 300 --size 80x40 --seed 42 --no-color > /tmp/grava-frame
          test "$(wc -l < /tmp/grava-frame)" -eq 40
          sudo snap remove grava
      - uses: actions/upload-artifact@v4
        with:
          name: grava-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
